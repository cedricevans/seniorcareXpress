name: Check VA form editions

# Fails (and GitHub emails the repo owner) when VA publishes a newer edition of a form we fill.
on:
  schedule:
    - cron: '0 13 1,15 * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python3 tools/check_va_editions.py
